name: Security audit
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  dependency-and-secret-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend dependency audit
        run: npm install --ignore-scripts --no-fund && npm audit --omit=dev --audit-level=high
      - name: Backend dependency audit
        working-directory: backend
        run: npm install --ignore-scripts --no-fund && npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  dast-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require staging target
        run: test -n "${{ secrets.FLOWDESK_STAGING_URL }}"
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.FLOWDESK_STAGING_URL }}
          fail_action: true
